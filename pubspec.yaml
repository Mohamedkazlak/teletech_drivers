name: teletech_drivers
description: TeleCars — company car and trip assignment.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.0.3
  go_router: ^16.2.4
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  mobile_scanner: ^7.1.3
  qr_flutter: ^4.1.0
  intl: any
  equatable: ^2.0.7
  flutter_animate: ^4.5.2
  google_fonts: ^9.0.0
  permission_handler: ^13.0.2
  geocoding: ^5.0.0
  wakelock_plus: ^1.8.0
  shared_preferences: ^2.5.6
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  fl_chart: ^1.3.0
  dart_pusher_channels: ^1.3.1
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter_local_notifications: ^23.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  fake_async: ^1.3.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0B1F45"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/branding/app_icon_monochrome.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
